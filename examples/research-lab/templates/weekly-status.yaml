# Weekly status for the PI and partner Tessaline. Schema template (brainDB Addendum A4).
week_of: "date of the group meeting:date|kind=note"
goal: "go/no-go decision for EL-7 pouch validation:text|kind=decision"
decision_date: "go/no-go on 500-cycle pouch validation moved to date:date|kind=decision"
pi: "PI principal investigator no pouch validation:name|kind=note"
pi_email: "PI email no pouch validation until the 45 °C question is answered:email|kind=note"
headline:
  retention_25c: "EL-7 retains capacity after 200 cycles at C/2 and 25 °C:percent|kind=fact"
  retention_45c: "at 45 °C EL-7 fades faster capacity after 150 cycles:percent|kind=fact"
  low_temp_capacity: "capacity at −20 °C relative to room temperature:percent"
  sei_resistance: "SEI resistance from EIS after 50 cycles EL-7 ohm:text|kind=fact"
running_experiments[]: "running experiments|kind=experiment|limit=5"
running_experiments[].run: ".fields.run_id"
running_experiments[].condition: ".fields.condition"
running_experiments[].operator: ".fields.operator"
running_experiments[].status: ".fields.status"
hypotheses[]: "current hypotheses|kind=hypothesis|limit=4"
hypotheses[].id: ".id"
hypotheses[].text: ".text"
hypotheses[].evidence: "evidence for or against this hypothesis"
partner:
  name: "industry partner company name:name"
  claim_requested: "cycle-life claim requested by the partner:text"
  answer: "draft answer on cycle-life claim:text|kind=decision"
deadlines: "upcoming deadlines:list|kind=task|scope=context"
lab_ops:
  glovebox: "glovebox oxygen and water level:text|kind=fact"
  regeneration_due: "glovebox regeneration due date:date"
risks: "open questions and risks:list|kind=question|scope=context"
