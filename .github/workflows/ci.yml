name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (vet, test, race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # The Go server embeds internal/server/ui/dist. Only the placeholder index.html is committed,
      # which is enough to build and test without installing the web toolchain.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "not gofmt'd:"; echo "$unformatted"; exit 1; fi
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...

  web:
    name: Web (typecheck, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint:emoji
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  smoke:
    name: Smoke (HTTP API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -o bin/braindb ./cmd/braindb
      # Serving and probing must share one step: a background process does not survive between them.
      - name: Seed, serve and smoke-test the sales-company example
        run: |
          set -eu
          mkdir -p data
          bin/braindb seed examples/sales-company/seed.json -o data/brain.xml --ingest examples/sales-company/docs
          cp -r examples/sales-company/templates data/templates
          bin/braindb serve --brain data/brain.xml --addr 127.0.0.1:7791 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          up=0
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:7791/api/health >/dev/null; then up=1; break; fi
            sleep 0.5
          done
          [ "$up" = 1 ] || { echo "server did not come up" >&2; exit 1; }
          sh scripts/smoke-test.sh

  cross-compile:
    name: Cross-compile release binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make release
